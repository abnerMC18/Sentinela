<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Comando - Sentinela das Encostas</title>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Bibliotecas: Chart.js (Gráficos) e Leaflet (Mapas) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Cabeçalho -->
      <header>
        <div class="title-area">
          <h1>SENTINELA DAS ENCOSTAS</h1>
          <p class="subtitle">CENTRO DE COMANDO IOT GEOLÓGICO</p>
        </div>
        <div class="badge-modo">
          <span class="dot live"></span> Rede Ativa:
          <span id="sensores-ativos">0</span> Sentinela(s)
        </div>
      </header>

      <!-- Cartões de Visão Geral -->
      <div class="cards-grid">
        <div class="card card-temp">
          <h3>STATUS DA CONSTELAÇÃO</h3>
          <div class="valor status" id="val-rede">A LIGAR...</div>
        </div>
        <div class="card card-umid">
          <h3>MÉDIA DE UMIDADE (REDE)</h3>
          <div class="valor" id="val-umid-media">-- %</div>
        </div>
        <div class="card card-risco">
          <h3>ALERTA MÁXIMO GLOBAL</h3>
          <div class="valor status" id="val-status-global">SEGURO</div>
        </div>
      </div>

      <!-- Painel Principal (Mapa + Lista de Sentinelas) -->
      <div class="main-panel">
        <div class="map-wrapper">
          <h3 class="panel-title">TOPOLOGIA DA REDE</h3>
          <div id="mapa-sentinelas" class="map-container"></div>
        </div>

        <div class="sensors-wrapper">
          <h3 class="panel-title">SENTINELAS EM ÓRBITA</h3>
          <div class="sensors-list" id="lista-sensores">
            <!-- Os sensores aparecerão aqui -->
          </div>
        </div>
      </div>

      <!-- Área do Gráfico de Telemetria -->
      <div class="chart-wrapper">
        <h3 class="panel-title">TELEMETRIA (ÚLTIMO SENSOR ATUALIZADO)</h3>
        <div class="chart-container">
          <canvas id="graficoSensores"></canvas>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
